name: WFS-Testdaten holen (Branch wfs-test, nicht Webseite)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u tools/wfs_holen.py tools/planbild_faelle.json /tmp/wfs
      - name: Auf eigenen Branch legen
        run: |
          git config user.name "Eduard Beches"; git config user.email "eb@quickestate.at"
          git checkout --orphan wfs-test; git rm -rq --cached . ; rm -rf ./* .github
          cp /tmp/wfs/* .; git add *.json
          git commit -qm "WFS-Testdaten (Stadt Wien, CC BY 4.0)"; git push -fq origin wfs-test
